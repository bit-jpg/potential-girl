<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baguio College of Technology | Student Registration</title>
    <link rel="icon" type="image/png" href="Images/Logos/BCTLogo.png" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="CSS/style.css" />
</head>

<body class="page-register">
    <div class="bg-slideshow" id="bgSlideshow" aria-hidden="true">
        <div class="bg-slide bg-slide-1 active"></div>
        <div class="bg-slide bg-slide-2"></div>
        <div class="bg-slide bg-slide-3"></div>
    </div>

    <div class="bg-overlay" aria-hidden="true"></div>

    <main class="login-stage">
        <section class="login-panel" aria-labelledby="schoolName">
            <div class="panel-content">
                <header class="register-header">
                    <img class="register-seal" src="Images/Logos/BCTLogo.png" alt="Baguio College of Technology seal" />
                    <div class="register-heading">
                        <h1 id="schoolName">Baguio College of Technology</h1>
                        <p>Leader in Technical Education since 1972</p>
                    </div>
                </header>

                <form id="registerForm" class="register-form" action="register.php" method="POST" novalidate>
                    <div class="register-grid">
                        <div class="register-field">
                            <label class="visually-hidden" for="regFirstName">First name</label>
                            <input type="text" class="dark-input" id="regFirstName" name="first_name"
                                placeholder="First name" autocomplete="given-name" required />
                        </div>

                        <div class="register-field">
                            <label class="visually-hidden" for="regUsername">Username</label>
                            <input type="text" class="dark-input" id="regUsername" name="username"
                                placeholder="Username" autocomplete="username" required />
                        </div>

                        <div class="register-field">
                            <label class="visually-hidden" for="regMiddleName">Middle name</label>
                            <input type="text" class="dark-input" id="regMiddleName" name="middle_name"
                                placeholder="Middle name" autocomplete="additional-name" />
                        </div>

                        <div class="register-field">
                            <label class="visually-hidden" for="regEmail">Email</label>
                            <input type="email" class="dark-input" id="regEmail" name="email" placeholder="email"
                                autocomplete="email" required />
                        </div>

                        <div class="register-field name-with-suffix">
                            <label class="visually-hidden" for="regLastName">Last name / Surname</label>
                            <input type="text" class="dark-input" id="regLastName" name="last_name"
                                placeholder="Last name/Surname" autocomplete="family-name" required />
                            <label class="visually-hidden" for="regSuffix">Suffix</label>
                            <select class="suffix-input" id="regSuffix" name="suffix" aria-label="Suffix">
                                <option value="" selected>Suffix</option>
                                <option value="Jr.">Jr.</option>
                                <option value="Sr.">Sr.</option>
                                <option value="II">II</option>
                                <option value="III">III</option>
                                <option value="IV">IV</option>
                            </select>
                        </div>

                        <div class="register-field">
                            <label class="visually-hidden" for="regIdNo">ID no</label>
                            <input type="text" class="dark-input" id="regIdNo" name="id_no" placeholder="Id no"
                                autocomplete="off" required />
                        </div>

                        <div class="register-field">
                            <label class="visually-hidden" for="regPassword">Password</label>
                            <div class="dark-password">
                                <input type="password" id="regPassword" name="password" placeholder="Password"
                                    autocomplete="new-password" required />
                                <button class="toggle-password" type="button" id="toggleRegPassword"
                                    aria-label="Toggle password visibility" aria-pressed="false">
                                    <i class="fas fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>

                        <div class="register-field">
                            <label class="visually-hidden" for="regConfirmPassword">Confirm password</label>
                            <div class="dark-password">
                                <input type="password" id="regConfirmPassword" name="confirm_password"
                                    placeholder="Confirm password" autocomplete="new-password" required />
                                <button class="toggle-password" type="button" id="toggleConfirmPassword"
                                    aria-label="Toggle password visibility" aria-pressed="false">
                                    <i class="fas fa-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="register-actions">
                        <button type="submit" class="btn-signup">Sign up</button>
                        <p class="existing-account">
                            Already have an account? <a href="LoginPage.html" data-transition>Login.</a>
                        </p>
                    </div>
                </form>

                <p class="panel-footer">
                    &copy; 2026 Baguio College of Technology &middot; Student Portal
                </p>
            </div>
        </section>
    </main>

    <script src="JS/script.js"></script>
</body>

</html>
