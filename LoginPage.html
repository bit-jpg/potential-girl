<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baguio College of Technology | Student Portal Login</title>
    <link rel="icon" type="image/png" href="Images/Logos/BCTLogo.png" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="CSS/style.css" />
</head>

<body class="page-login">
    <div class="bg-slideshow" id="bgSlideshow" aria-hidden="true">
        <div class="bg-slide bg-slide-1 active"></div>
        <div class="bg-slide bg-slide-2"></div>
        <div class="bg-slide bg-slide-3"></div>
    </div>

    <div class="bg-overlay" aria-hidden="true"></div>

    <main class="login-stage">
        <section class="login-panel" aria-labelledby="schoolName">
            <div class="panel-content">
                <div class="seal-badge">
                    <img src="Images/Logos/BCTLogo.png" alt="Baguio College of Technology seal" />
                </div>

                <div class="acronym-boxes" aria-hidden="true">
                    <div class="letter-box">B</div>
                    <div class="letter-box letter-box-tall">C</div>
                    <div class="letter-box">T</div>
                </div>

                <h1 class="school-full-name" id="schoolName">
                    Baguio College of Technology
                </h1>

                <svg class="motto-arc" viewBox="0 0 400 56" xmlns="http://www.w3.org/2000/svg" role="img"
                    aria-label="Leader in Technical Education since 1972">
                    <path id="mottoArcPath" d="M10 10 Q200 54 390 10" fill="none" />
                    <text class="motto-text">
                        <textPath href="#mottoArcPath" startOffset="50%" text-anchor="middle">
                            Leader in Technical Education since 1972
                        </textPath>
                    </text>
                </svg>

                <form id="loginForm" class="auth-form login-form" action="login.php" method="POST" novalidate>
                    <div class="field">
                        <label class="visually-hidden" for="studentId">Student's ID</label>
                        <input type="text" class="input-bar" id="studentId" name="studentId" placeholder="Student's ID"
                            autocomplete="username" required />
                    </div>

                    <div class="field">
                        <label class="visually-hidden" for="studentPassword">Student's Password</label>
                        <div class="password-bar">
                            <input type="password" id="studentPassword" name="studentPassword"
                                placeholder="Student's Password" autocomplete="current-password" required />
                            <button class="toggle-password" type="button" id="togglePassword"
                                aria-label="Toggle password visibility" aria-pressed="false">
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-links">
                        <a href="#" class="reset-link" id="resetPasswordLink">Reset password</a>
                        <a href="RegistrationPage.html" class="register-link" data-transition>Register</a>
                    </div>

                    <button type="submit" class="btn-login">Login</button>
                </form>

                <p class="panel-footer">
                    &copy; 2026 Baguio College of Technology &middot; Student Portal
                </p>
            </div>
        </section>
    </main>

    <script src="JS/script.js"></script>
</body>

</html>
